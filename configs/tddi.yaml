# Shared experiment config
seed: 42
epochs_per_task: 1
batch_size: 256
learning_rate: 9.4526e-5
weight_decay: 1.5446e-4
class_order: random
scale_numerical: true

# T-DDI model config
focal_gamma: 1.0
use_class_weights: true
class_weight_power: 0.5
max_class_weight: 10.0
hidden_dim: 64
depth: 3
ff_dropout: 0.2

# Memory-based methods: GEM and A-GEM
memory_samples_per_class: 10
gem_memory_strength: 0.5

# EWC method
ewc_lambda: 10.0
fisher_n_batches: 50
